# Global tool versions (migrated from ~/.tool-versions).
# Projects override these with their own mise.toml / .tool-versions.

[tools]
go = "1.24.4"
node = "20.19.6"
# 3.12.5 builds have no GitHub artifact attestations, so mise refuses them.
python = "3.12.16"
ruby = "3.3.4"
rust = "1.96.0"
terraform = "1.9.3"
bun = "1.3.14"

# Editor and its helpers (treesitter parsers, formatters, linters)
neovim = "latest"
tree-sitter = "latest"
stylua = "latest"
shfmt = "latest"
shellcheck = "latest"

# CLI tools that apt does not ship, or ships too old
ghq = "latest"
# Ctrl-G (ghql). Debian's peco 0.5.10 prints raw terminfo strings ("%p1%dG")
# and garbles its prompt in iTerm over SSH; upstream 0.6.0 does not.
peco = "0.6.0"
