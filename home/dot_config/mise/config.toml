# Global tool versions (migrated from ~/.tool-versions).
# Projects override these with their own mise.toml / .tool-versions.

[tools]
go = "1.24.4"
node = "20.19.6"
# 3.12.5 builds have no GitHub artifact attestations, so mise refuses them.
python = "3.12.16"
ruby = "3.3.4"
rust = "1.96.0"
terraform = "1.9.3"
bun = "latest" # was from the oven-sh/bun tap, which Homebrew now needs trusted

# Editor and its helpers (treesitter parsers, formatters, linters)
neovim = "latest"
tree-sitter = "latest"
stylua = "latest"
shfmt = "latest"
shellcheck = "latest"

# CLI tools that apt does not ship
ghq = "latest"
