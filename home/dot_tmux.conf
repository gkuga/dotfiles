# Key bindings follow ~/.screenrc so that muscle memory carries over.

# Prefix: ^T (same as screen's "escape ^Tt"); ^T ^T sends a literal ^T.
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# screenrc: term xterm-256color / defscrollback 10000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 10000
set -g mouse on

# Copy mode with vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Clipboard via OSC 52 (works over ssh and in Windows Terminal / iTerm2)
set -g set-clipboard on

# screenrc: resize mode. ^T e (or ^T ^E), then h/j/k/l repeatedly; any other key exits.
bind e   switch-client -T resize
bind C-e switch-client -T resize
bind -T resize h   resize-pane -L 1 \; switch-client -T resize
bind -T resize l   resize-pane -R 1 \; switch-client -T resize
bind -T resize j   resize-pane -D 1 \; switch-client -T resize
bind -T resize k   resize-pane -U 1 \; switch-client -T resize
bind -T resize C-h resize-pane -L 1 \; switch-client -T resize
bind -T resize C-l resize-pane -R 1 \; switch-client -T resize
bind -T resize C-j resize-pane -D 1 \; switch-client -T resize
bind -T resize C-k resize-pane -U 1 \; switch-client -T resize

# Move between panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# screenrc: caption always "%{= mw} %-w%{=b cw}%n %t%{-}%+w %= %{=b mw}%y/%m/%d"
set -g status-position bottom
set -g status-style "bg=magenta,fg=white"
set -g status-left ""
set -g status-right "#[bold] %Y/%m/%d "
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,bg=cyan,fg=white"

# Number windows from 1, like the keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Responsive for vim and TUI agents
set -g escape-time 10
set -g focus-events on

# Reload: ^T r (screenrc unbinds r, so it is free)
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"
